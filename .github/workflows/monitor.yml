name: ☀️ Ra Pulse Cloud Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 🔑 ESTO CORRIGE EL ERROR 403: Otorga permisos de escritura al bot nativo de Actions
permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🌌 Run Ra Pulse
        run: node index.js

      - name: 💾 Persist telemetry state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 telemetry: actualización automática del pulso del sistema [skip ci]"
              # 🚀 Eliminamos la URL compleja; usando el GITHUB_TOKEN nativo con permisos de escritura
              git push origin main
            else
              echo "No se detectaron cambios en el estado de telemetría."
            fi
          else
            echo "state.json no fue generado en este pulso."
          fi
