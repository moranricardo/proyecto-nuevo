name: ☀️ Ra Pulse Cloud Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 🌌 Run Ra Pulse
        run: node index.cjs

      - name: 💾 Persist telemetry state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 telemetry: actualización automática del pulso del sistema [skip ci]"
            else
              echo "No se detectaron cambios."
            fi
          else
            echo "state.json no fue generado."
          fi

      - name: 🚀 Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
