name: ☀️ Ra Pulse Cloud Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🌌 Run Ra Pulse
        run: node index.js

      - name: 💾 Persist telemetry state
        env:
          MY_TOKEN: ${{ secrets.RE_PULSE_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 telemetry: actualización automática del pulso del sistema [skip ci]"
              git push https://moranricardo:${MY_TOKEN}@github.com/moranricardo/proyecto-nuevo.git main
            else
              echo "No se detectaron cambios en el estado de telemetría."
            fi
          else
            echo "state.json no fue generado en este pulso."
          fi
