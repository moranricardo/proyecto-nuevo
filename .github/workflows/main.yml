name: Ra Pulse CI
on: [push, workflow_dispatch]
jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Diagnostico
        run: |
          echo "Listando archivos:"
          ls -R
          echo "Version de node:"
          node -v
      - name: Ejecutar auditoría
        run: |
          npm init -y
          npm pkg set type="module"
          node src/rapulse.js
