name: Ra Pulse Master CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *' # Se ejecuta de forma segura cada hora

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v7

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 📦 Instalar Dependencias
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: 🌌 Ejecutar Ra Pulse
        run: node index.cjs

      - name: 💾 Persistir telemetría (state.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "🤖 telemetry: actualización automática [skip ci]"
              git push
            else
              echo "No se detectaron cambios en el pulso. Omitiendo commit."
            fi
          else
            echo "state.json no fue generado."
          fi
