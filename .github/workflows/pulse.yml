name: Ciclo de Ra - Pulse Orchestrator

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente cada hora
  workflow_dispatch:     # Permite la ejecución manual desde la interfaz de GitHub

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TELEMETRY_TOKEN || github.token }}
        fetch-depth: 0

    - name: Configurar Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci || npm install

    - name: Ejecutar Orquestador Maestro (index.js)
      env:
        GITHUB_ACTIONS: 'true'
        CYCLE_INTERVAL_MS: '0' # En CI se ejecuta un único ciclo de validación
      run: node index.js

    - name: Verificar cambios en la telemetría
      id: verify_changes
      run: |
        git diff --exit-code state.json || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Persistir estado de telemetría (Commit & Push)
      if: steps.verify_changes.outputs.changed == 'true'
      env:
        GIT_AUTHOR_NAME: 'GitHub Action Bot'
        GIT_AUTHOR_EMAIL: 'action@github.com'
        GIT_COMMITTER_NAME: 'GitHub Action Bot'
        GIT_COMMITTER_EMAIL: 'action@github.com'
      run: |
        git add state.json
        git commit -m "🤖 telemetry: actualización automática del pulso del sistema [skip ci]"
        git push origin main
